<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Book / Tablet Open Base -->
  <path d="M120 370 C 180 345, 230 355, 256 375 C 282 355, 332 345, 392 370 L 392 180 C 332 155, 282 165, 256 185 C 230 165, 180 155, 120 180 Z" fill="#042f2e" stroke="#34d399" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Center Divider -->
  <path d="M256 185 L256 375" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  
  <!-- Arabic Letter Ain / Dhad or Modern stylized Arabic Character (ض / ع) -->
  <text x="188" y="295" font-family="'Amiri', 'Traditional Arabic', 'Segoe UI', serif" font-size="115" font-weight="bold" fill="#34d399" text-anchor="middle">ض</text>
  
  <!-- Latin Letter 'A' or 'ID' for Indonesia -->
  <text x="325" y="295" font-family="'Segoe UI', system-ui, sans-serif" font-size="100" font-weight="900" fill="#f8fafc" text-anchor="middle">ID</text>
  
  <!-- Sparkles Icon representing AI Context -->
  <path d="M 256 100 L 263 125 L 288 132 L 263 139 L 256 164 L 249 139 L 224 132 L 249 125 Z" fill="#34d399" />
</svg>
